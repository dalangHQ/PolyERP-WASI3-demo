[package]
name = "rust-inventory"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.58", features = ["async-spawn", "inter-task-wakeup"] }
futures = "0.3"
async-stream = "0.3"
lazy_static = "1.4"
tokio = { version = "1", features = ["sync", "rt"] }
