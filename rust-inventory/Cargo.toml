[package]
name = "rust-inventory"
version = "0.1.0"
edition = "2021"

[dependencies]
wit-bindgen-rt = { version = "0.41", features = ["bitflags"] }
lazy_static = "1.4"

[package.metadata.component]
package = "demo:poly-erp-inventory"

[package.metadata.component.target]
path = "../wit"
world = "inventory-service"

[lib]
crate-type = ["cdylib"]
